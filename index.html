
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101014">
  <title>Novell</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Заставка -->
  <section id="splash" class="screen splash">
    <div class="studio-title">Soon... studio</div>
  </section>

  <!-- Главное меню -->
  <section id="mainMenu" class="screen main-menu hidden">
    <img class="menu-character" src="assets/Chacter.png" alt="">
    <div class="main-buttons">
      <h1>Novell</h1>
      <button id="newGameBtn">Новая игра</button>
      <button id="continueBtn" disabled>Продолжить</button>
      <button id="loadBtn">Загрузить игру</button>
      <button id="creditsBtn">Разработчики</button>
      <button id="settingsBtn">Настройки</button>
      <button id="exitBtn">Выйти</button>
    </div>
  </section>

  <!-- Сцена новеллы -->
  <section id="gameScreen" class="screen game-screen hidden">
    <div id="scene" class="scene">
      <img id="dialogCharacter" class="dialog-character"
           src="assets/chacter.png" alt="Персонаж">

      <div id="dialogueBox" class="dialogue-box">
        <div id="speaker" class="speaker">Персонаж</div>
        <div id="dialogText" class="dialog-text"></div>
        <div id="choices" class="choices"></div>

        <div class="dialogue-toolbar">
          <button id="backBtn">Назад</button>
          <button id="autoBtn">Авто</button>
          <button id="logsBtn">Логи</button>
          <button id="gameMenuBtn">Меню</button>
        </div>
      </div>

      <button id="nextArea" class="next-area"
              aria-label="Следующее сообщение"></button>
    </div>
  </section>

  <!-- Внутриигровое меню -->
  <section id="gameMenu" class="screen pause-screen hidden">
    <div class="pause-panel">
      <h2>Меню игры</h2>
      <button id="resumeBtn">Продолжить</button>
      <button id="saveBtn">Сохранить</button>
      <button id="pauseLoadBtn">Загрузить</button>
      <button id="pauseSettingsBtn">Настройки</button>
      <button id="mainMenuBtn">Главное меню</button>
    </div>
  </section>

  <!-- Окна: сохранения, настройки, логи, титры -->
  <div id="modalLayer" class="modal-layer hidden">
    <div class="modal-window">
      <button id="closeModalBtn" class="modal-close"
              aria-label="Закрыть">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
